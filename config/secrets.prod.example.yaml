agent:
  # Hyperliquid user address read by HyperliquidAccountant.
  AGENT_HL_USER: "0xreplace"

  # Shell command used by LlmStrategyAgent. It must read prompt text from stdin
  # and write one JSON response to stdout.
  AGENT_LLM_COMMAND: "claude -p"

  # Bearer token for POST /v1/operator/halt and /v1/operator/resume.
  AGENT_OPERATOR_TOKEN: "<replace_with_long_random_token>"

  # Optional overrides.
  AGENT_HL_TESTNET: "0"
  AGENT_HL_TTL_MS: "4000"
  AGENT_HTTP_PORT: "4100"
  AGENT_INTERVAL_MS: "30000"
  AGENT_AUDIT_PATH: "data/audit.jsonl"

web:
  NEXT_PUBLIC_API_BASE_URL: "https://api.hlprivateer.xyz"
