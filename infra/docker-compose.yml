# Build first: `bun run build`.
# This compose file runs the compiled agent and Next standalone server.

services:
  agent:
    image: oven/bun:1.2.19
    container_name: hlprivateer-agent
    restart: unless-stopped
    working_dir: /app
    command: ["bun", "apps/agent/dist/main.js"]
    env_file:
      - ../config/.env
    volumes:
      - ./..:/app:ro
      # Operator-owned wiring and strategy are gitignored; mount them read-only.
      - ../apps/agent/wiring.ts:/app/apps/agent/wiring.ts:ro
      - ../config/strategy.json:/app/config/strategy.json:ro
      # Audit output is mutable by design.
      - ../data:/app/data
    ports:
      - "127.0.0.1:4100:4100"

  web:
    image: oven/bun:1.2.19
    container_name: hlprivateer-web
    restart: unless-stopped
    working_dir: /app
    command: ["bun", "apps/web/.next/standalone/apps/web/server.js"]
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://agent:4100}
    volumes:
      - ./..:/app:ro
    depends_on:
      - agent
    ports:
      - "127.0.0.1:3000:3000"
