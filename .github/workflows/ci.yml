name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Validate Docker Compose
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker compose -f infra/docker-compose.yml config >/dev/null
          else
            echo "docker unavailable; skipping compose validation"
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
