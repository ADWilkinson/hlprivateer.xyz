name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install
        run: bun install --frozen-lockfile

      # Each workspace's tsconfig clears the inherited `paths` map, so dependent
      # packages resolve workspace deps via node_modules → `types: dist/...`.
      # Build before typecheck so dist/ exists for downstream packages.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

